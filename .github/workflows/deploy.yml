name: CI/CD Microservice Pipeline

on:
  push:
    branches:
      - main
      - feature/api-gateway
      - feature/jira-observability

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Injects the agent into Jib's universal overlay layer before compilation
      - name: Inject OpenTelemetry Javaagent for Google Jib
        run: |
          SERVICES=("configserver" "eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Injecting agent dependency into $SERVICE..."
            mkdir -p "$SERVICE/src/main/jib/app/libs"
            curl -L -o "$SERVICE/src/main/jib/app/libs/opentelemetry-javaagent-2.22.0.jar" \
              https://github.com
          done

      # 2. Builds and pushes images with hard-mapped username secrets to prevent loop context erasure
      - name: Compile and Push Microservices
        run: |
          SERVICES=("configserver" "eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Building and pushing service image: $SERVICE"
            mvn -f "$SERVICE/pom.xml" clean compile jib:build -Ddocker.username="${{ secrets.DOCKERHUB_USERNAME }}"
          done
