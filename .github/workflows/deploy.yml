name: CI/CD Microservice Pipeline

on:
  push:
    branches:
      - main
      - feature/jira-observability # ADD THIS LINE: Tells Jib to build containers for your gateway branch too!

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your project files to the cloud runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. FIXED: Switched to the oracle distribution to natively unlock Java 26 compilation support
      - name: Setup JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      # 3. Log into your Docker Hub account using your repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. NEW STEP: Automatically download and inject the agent into Jib's source structure
      - name: Inject OpenTelemetry Javaagent
        run: |
          SERVICES=("configserver" "eurekaserver" "accounts" "cards" "loans" "gatewayserver")
          for SERVICE in "${SERVICES[@]}"; do
            mkdir -p $SERVICE/src/main/jib/app/libs/
            curl -L -o $SERVICE/src/main/jib/app/libs/opentelemetry-javaagent.jar \
            https://github.com
          done

      # 5. Step into all 6 microservice folders individually and build via Jib
      - name: Compile and Push Microservices
        run: |
          for SERVICE in configserver eurekaserver accounts cards loans gatewayserver; do
            mvn -f $SERVICE/pom.xml clean compile jib:build
          done