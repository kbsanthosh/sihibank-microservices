name: CI/CD Microservice Pipeline

on:
  push:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # JOB 1: FAST JVM MICROSERVICES BUILD (Your original automated Jib flow)
  # -------------------------------------------------------------
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your project files to the cloud runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Initialize the Java 25 environment securely (Downgraded from 26 for GraalVM compatibility)
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Log into your Docker Hub account using your repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Step into all 5 microservice folders individually and build via Jib
      - name: Compile and Push Microservices
        run: |
          echo "Building Config Server..."
          mvn -f configserver/pom.xml clean compile jib:build
          
          echo "Building Eureka Server..."
          mvn -f eurekaserver/pom.xml clean compile jib:build
          
          echo "Building Accounts Microservice..."
          mvn -f accounts/pom.xml clean compile jib:build
          
          echo "Building Cards Microservice..."
          mvn -f cards/pom.xml clean compile jib:build
          
          echo "Building Loans Microservice..."
          mvn -f loans/pom.xml clean compile jib:build

  # -------------------------------------------------------------
  # JOB 2: PARALLEL NATIVE BUILD (Runs concurrently for business APIs)
  # -------------------------------------------------------------
  build-and-push-graalvm-native:
    runs-on: ubuntu-latest
    strategy:
      # This runs all 3 core REST APIs in separate parallel VMs at the exact same time
      matrix:
        service: [accounts, cards, loans]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Set up specialized GraalVM 25 compiler tools
      - name: Set up GraalVM Runtime 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dynamically reads the version from the specific subdirectory POM and builds natively
      - name: Build and Push Native Image (GraalVM)
        run: |
          PROJECT_VERSION=$(mvn -f ${{ matrix.service }}/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          mvn -f ${{ matrix.service }}/pom.xml spring-boot:build-image \
            -Dspring-boot.build-image.imageName=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${PROJECT_VERSION}-native \
            -Dspring-boot.build-image.buildpacks=gcr.io/paketo-buildpacks/java-native-image \
            -Dspring-boot.build-image.env.BP_NATIVE_IMAGE_BUILD_ARGUMENTS="--no-fallback"
