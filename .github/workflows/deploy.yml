name: CI/CD Microservice Pipeline

on:
  push:
    branches:
      - main
      - feature/jira-observability

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Download OpenTelemetry Java Agent into Jib's extra directory structure for ALL services
      - name: Download OpenTelemetry Java Agent
        run: |
          ALL_SERVICES=("configserver" "eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${ALL_SERVICES[@]}"; do
            echo "Injecting OpenTelemetry Java Agent into $SERVICE..."
            mkdir -p "$SERVICE/src/main/jib/app/libs"
            curl -L -o "$SERVICE/src/main/jib/app/libs/opentelemetry-javaagent-2.22.0.jar" \
              https://github.com
          done

      # 1. First, build and install all local modules so parent dependencies resolve correctly
      - name: Pre-install All Maven Artifacts
        run: |
          SERVICES=("configserver" "eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Pre-installing local dependencies for: $SERVICE"
            mvn -f "$SERVICE/pom.xml" clean install -DskipTests jib:build@none
          done

      # 2. Build configserver and push container image using Jib
      - name: Build and Push Docker Image with Jib
        run: |
          mvn -f "configserver/pom.xml" compile jib:build -Ddocker.username="${{ secrets.DOCKERHUB_USERNAME }}"

      # 3. Safely process individual microservice push actions one by one
      - name: Compile and Push Remaining Microservices
        run: |
          SERVICES=("eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Building and pushing service image: $SERVICE"
            mvn -f "$SERVICE/pom.xml" compile jib:build -Ddocker.username="${{ secrets.DOCKERHUB_USERNAME }}"
          done
