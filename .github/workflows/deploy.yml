name: CI/CD Microservice Pipeline

on:
  push:
    branches:
      - main
      - feature/jira-observability

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Download valid OpenTelemetry Java Agent binaries into the workspace overlay layers
      - name: Download OpenTelemetry Java Agent
        run: |
          ALL_SERVICES=("configserver" "eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${ALL_SERVICES[@]}"; do
            echo "Injecting valid binary agent dependency into $SERVICE..."
            mkdir -p "$SERVICE/src/main/jib/app/libs"
            curl -L -f -o "$SERVICE/src/main/jib/app/libs/opentelemetry-javaagent-2.22.0.jar" \
            https://repo.maven.apache.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/2.22.0/opentelemetry-javaagent-2.22.0.jar
          done

      # 1. Build and deploy configserver via explicit target path properties
      - name: Build and Push Configserver
        run: |
          mvn -f "configserver/pom.xml" clean compile jib:build -DskipTests -Ddocker.username="${{ secrets.DOCKERHUB_USERNAME }}"

      # 2. Build and deploy the remaining cluster applications cleanly
      - name: Compile and Push Remaining Microservices
        run: |
          SERVICES=("eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Processing independent service image layer: $SERVICE"
            mvn -f "$SERVICE/pom.xml" clean compile jib:build -DskipTests -Ddocker.username="${{ secrets.DOCKERHUB_USERNAME }}"
          done
