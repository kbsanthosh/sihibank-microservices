name: CI/CD Microservice Pipeline

on:
  push:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # JOB 1: FAST JVM MICROSERVICES BUILD (Your automated Jib flow)
  # -------------------------------------------------------------
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compile and Push Microservices
        run: |
          echo "Building Config Server..."
          mvn -f configserver/pom.xml clean compile jib:build
          
          echo "Building Eureka Server..."
          mvn -f eurekaserver/pom.xml clean compile jib:build
          
          echo "Building Accounts Microservice..."
          mvn -f accounts/pom.xml clean compile jib:build
          
          echo "Building Cards Microservice..."
          mvn -f cards/pom.xml clean compile jib:build
          
          echo "Building Loans Microservice..."
          mvn -f loans/pom.xml clean compile jib:build

  # -------------------------------------------------------------
  # JOB 2: PARALLEL NATIVE BUILD (Bypassing Dynamic Refresh Scopes)
  # -------------------------------------------------------------
  build-and-push-graalvm-native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [accounts, cards, loans]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up GraalVM Runtime 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FIXED: Appends refresh disabling flags directly into the configuration layers
      # This prevents the dynamic proxy generator from triggering during AOT tree-shaking
      - name: Modify Configuration Files for Build Time
        run: |
          YML_FILE="${{ matrix.service }}/src/main/resources/application.yml"
          PROP_FILE="${{ matrix.service }}/src/main/resources/application.properties"
          
          if [ -f "$YML_FILE" ]; then
            echo "Patching application.yml..."
            sed -i 's/configserver:/optional:configserver:/g' "$YML_FILE"
            sed -i 's/fail-fast: true/fail-fast: false/g' "$YML_FILE"
            sed -i 's/failFast: true/failFast: false/g' "$YML_FILE"
            echo "  cloud:" >> "$YML_FILE"
            echo "    refresh:" >> "$YML_FILE"
            echo "      enabled: false" >> "$YML_FILE"
          fi
          
          if [ -f "$PROP_FILE" ]; then
            echo "Patching application.properties..."
            sed -i 's/spring.config.import=configserver:/spring.config.import=optional:configserver:/g' "$PROP_FILE"
            sed -i 's/spring.cloud.config.fail-fast=true/spring.cloud.config.fail-fast=false/g' "$PROP_FILE"
            echo "spring.cloud.refresh.enabled=false" >> "$PROP_FILE"
          fi

      # Pre-packages the target resources with the static configurations in place
      - name: Pre-compile and Process Spring AOT
        run: |
          mvn -f ${{ matrix.service }}/pom.xml clean package spring-boot:process-aot -DskipTests

      # Generates the Native Image from the isolated assets
      - name: Build and Push Native Image (GraalVM)
        run: |
          PROJECT_VERSION=$(mvn -f ${{ matrix.service }}/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          mvn -f ${{ matrix.service }}/pom.xml spring-boot:build-image-no-fork \
            -Dspring-boot.build-image.imageName=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${PROJECT_VERSION}-native \
            -Dspring-boot.build-image.buildpacks=gcr.io/paketo-buildpacks/java-native-image \
            -Dspring-boot.build-image.env.BP_NATIVE_IMAGE_BUILD_ARGUMENTS="--no-fallback"
