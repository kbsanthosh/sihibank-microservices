name: CI/CD Microservice Pipeline

on:
  push:
    branches:
      - main
      - feature/jira-observability

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # FIXED: Loop through ALL microservices to inject the agent into Jib's structure
      - name: Download OpenTelemetry Java Agent
        run: |
          ALL_SERVICES=("configserver" "eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${ALL_SERVICES[@]}"; do
            echo "Injecting OpenTelemetry Java Agent into $SERVICE..."
            mkdir -p "$SERVICE/src/main/jib/app/libs"
            curl -L -o "$SERVICE/src/main/jib/app/libs/opentelemetry-javaagent-2.22.0.jar" \
              https://github.com
          done

      # 1. Build configserver and push container image using Jib
      - name: Build and Push Docker Image with Jib
        run: |
          mvn clean compile jib:build -pl configserver -Ddocker.username="${{ secrets.DOCKERHUB_USERNAME }}"
      

      # 2. Builds others and pushes images with hard-mapped username secrets
      - name: Compile and Push Microservices
        run: |
          SERVICES=("eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Building and pushing service image: $SERVICE"
            mvn -f "$SERVICE/pom.xml" clean compile jib:build -Ddocker.username="${{ secrets.DOCKERHUB_USERNAME }}"
          done
