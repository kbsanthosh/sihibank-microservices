name: CI/CD Microservice Pipeline

on:
  push:
    branches:
      - main
      - feature/jira-observability # ADD THIS LINE: Tells Jib to build containers for your gateway branch too!

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your project files to the cloud runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. FIXED: Switched to the oracle distribution to natively unlock Java 26 compilation support
      - name: Setup JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'oracle'
          cache: 'maven'

      # 3. Log into your Docker Hub account using your repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. CRITICAL STEP: Inject the exact OTel agent file into Jib's overlay directory for every service
      - name: Inject OpenTelemetry Javaagent for Google Jib
        run: |
          SERVICES=("configserver" "eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Injecting agent into $SERVICE..."
            mkdir -p "$SERVICE/src/main/jib/app/libs"
            curl -L -o "$SERVICE/src/main/jib/app/libs/opentelemetry-javaagent-2.22.0.jar" \
              https://github.com
          done

      # 5. Step into all 6 microservice folders individually and build via Jib
      - name: Build and Push Microservice Images via Google Jib
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          SERVICES=("configserver" "eurekaserver" "gatewayserver" "accounts" "cards" "loans")
          for SERVICE in "${SERVICES[@]}"; do
            echo "Building and pushing $SERVICE..."
            mvn -f "$SERVICE/pom.xml" compile jib:build -Ddocker.username="$DOCKER_USERNAME"
          done