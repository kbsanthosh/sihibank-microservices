server:
  port: 8080

spring:
  application:
    name: accounts
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    #import:
    #  - "optional:configserver:http://localhost:8071"
    import: "configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8071}"
      # - "configserver:http://localhost:8071"


management:
  endpoints:
    web:
      exposure:
        include:
         # - "refresh"
          - "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true



eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "accounts"
    description: "Sihi Bank Accounts Application"
    version: "1.0.0"

logging:
  level:
    com:
      sihibank:
        accounts: DEBUG