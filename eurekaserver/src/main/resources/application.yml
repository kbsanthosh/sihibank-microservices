spring:
  application:
    name: eurekaserver
  config:
    import: "optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8071}"

management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
