  cards:
    image: "kbsanthosh/cards:11.0.0-RELEASE"
    container_name: cards-rest-api
    ports:
      - "9010:9000" # UPDATED: Changed host port to 9010 to resolve the clash with MinIO
    healthcheck:
      # CRITICAL: Keep 'localhost:9000' here because inside the container it still listens on 9000
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      SPRING_APPLICATION_NAME: cards
    extends:
      file: common-config.yml
      service: microservice-eureka-config


  gatewayserver:
    image: "kbsanthosh/gatewayserver:11.0.0-RELEASE"
    container_name: gatewayserver-rest-api
    ports:
      - "8072:8072"
    environment:
      SPRING_APPLICATION_NAME: gatewayserver
    depends_on:
      accounts:
        condition: service_healthy
      loans:
        condition: service_healthy
      cards:
          condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-eureka-config


