networks:
  sihibank-network:
    driver: "bridge"


services:

  configserver:
    image: "kbsanthosh/configserver:10.1.0-SNAPSHOT"
    container_name: configserver-rest-api
    ports:
      - "8071:8071"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8071/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s # Essential: Gives the Spring Boot JVM time to warm up before counting failures
    extends:
      file: common-config.yml
      service: microservice-base-config

  eurekaserver:
    image: "kbsanthosh/eurekaserver:10.1.0-SNAPSHOT"
    container_name: eurekaserver-rest-api
    ports:
      - "8070:8070"
    environment:
      SPRING_APPLICATION_NAME: eurekaserver
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8070/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s # Essential: Gives the Spring Boot JVM time to warm up before counting failures
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  accounts:
    image: "kbsanthosh/accounts:10.1.0-SNAPSHOT"
    container_name: accounts-rest-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      SPRING_APPLICATION_NAME: accounts
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  loans:
    image: "kbsanthosh/loans:10.1.0-SNAPSHOT"
    container_name: loans-rest-api
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      SPRING_APPLICATION_NAME: loans
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  #  loans2:
  #    image: "kbsanthosh/loans:10.1.0-SNAPSHOT"
  #    container_name: loans-rest-api-instance2
  #    ports:
  #      - "8091:8090"
  #    healthcheck:
  #      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health/readiness | grep UP || exit 1"]
  #      interval: 10s
  #      timeout: 5s
  #      retries: 10
  #      start_period: 30s
  #    environment:
  #      SPRING_APPLICATION_NAME: loans
  #    extends:
  #      file: common-config.yml
  #      service: microservice-eureka-config


  cards:
    image: "kbsanthosh/cards:10.1.0-SNAPSHOT"
    container_name: cards-rest-api
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health/readiness | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      SPRING_APPLICATION_NAME: cards
    extends:
      file: common-config.yml
      service: microservice-eureka-config


  gatewayserver:
    image: "kbsanthosh/gatewayserver:10.1.0-SNAPSHOT"
    container_name: gatewayserver-rest-api
    ports:
      - "8072:8072"
    environment:
      SPRING_APPLICATION_NAME: gatewayserver
    depends_on:
      accounts:
        condition: service_healthy
      loans:
        condition: service_healthy
      cards:
        condition: service_healthy

    extends:
      file: common-config.yml
      service: microservice-eureka-config


